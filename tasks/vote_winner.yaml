id: vote_winner
tier: function
freshness: fresh-ish (plurality with unique-max rule, election framing)
prompt: |
  Each element of the input is one vote for a candidate id. Return the
  candidate with the most votes. If the highest vote count is shared by more
  than one candidate, or the input is empty, there is no winner: return the
  language's idiomatic absent value. A quadratic scan is acceptable.
  Example: [3,1,3,2,3] -> 3; [1,2,1,2] -> no winner.
signatures:
  kaikai: "pub fn vote_winner(votes: [Int]) : Option[Int]"
  rust:   "pub fn vote_winner(votes: &[i64]) -> Option<i64>"
  go:     "func VoteWinner(votes []int64) (int64, bool)"
