id: next_free_id
tier: function
freshness: classic shape (first missing non-negative), id-allocator framing
prompt: |
  A connection pool has a list of ids currently in use (any order, duplicates
  possible, all >= 0). Allocate the next id: return the smallest non-negative
  integer not in the list. Example: [0,1,3] -> 2; [] -> 0. A linear scan per
  candidate is acceptable.
signatures:
  kaikai: "pub fn next_free_id(taken: [Int]) : Int"
  rust:   "pub fn next_free_id(taken: &[i64]) -> i64"
  go:     "func NextFreeID(taken []int64) int64"
