id: tile_size
tier: function
freshness: classic-algorithm (gcd via Euclid; training-data overlap likely)
prompt: |
  A rectangular floor is w by h units (both >= 1). Return the side length of
  the largest square tile that covers the floor exactly (no cuts, no gaps) —
  i.e. the greatest common divisor of w and h. Examples: (12, 18) -> 6,
  (7, 7) -> 7, (13, 7) -> 1.
signatures:
  kaikai: "pub fn tile_size(w: Int, h: Int) : Int"
  rust:   "pub fn tile_size(w: i64, h: i64) -> i64"
  go:     "func TileSize(w, h int64) int64"
