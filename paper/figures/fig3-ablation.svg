  <!-- Opus algorithm-heavy -57.0% -->
  <path d="M484,132 L249,132 Q245,132 245,136 L245,154 Q245,158 249,158 L484,158 Z" fill="#1baf7a"/>
  <text x="239" y="149" font-size="10.5" fill="#4a4943" text-anchor="end">-57%</text>
