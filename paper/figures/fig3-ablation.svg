    <text x="568" y="222">+20%</text>
  </g>
  <line x1="484" y1="40" x2="484" y2="210" stroke="#4a4943" stroke-width="1"/>
  <!-- rows: h=26 -->
  <!-- Fable stdlib-heavy +25.8% -->
