<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="170" fill="#ffffff"/>
  <text x="20" y="24" font-size="11" fill="#6b6a63">change in tokens per cell when kai info is removed</text>
  <!-- zero at x=220, 3.6 px per % -->
  <g stroke="#e8e7e2" stroke-width="1">
    <line x1="310" y1="44" x2="310" y2="122"/>
    <line x1="400" y1="44" x2="400" y2="122"/>
    <line x1="490" y1="44" x2="490" y2="122"/>
    <line x1="580" y1="44" x2="580" y2="122"/>
  </g>
  <g font-size="10" fill="#6b6a63" text-anchor="middle">
    <text x="220" y="140">0</text>
    <text x="310" y="140">+25%</text>
    <text x="400" y="140">+50%</text>
    <text x="490" y="140">+75%</text>
    <text x="580" y="140">+100%</text>
  </g>
  <line x1="220" y1="40" x2="220" y2="126" stroke="#4a4943" stroke-width="1"/>
  <!-- Opus 5.5 +75.0% -->
  <path d="M220,48 L486.2,48 Q490.2,48 490.2,52 L490.2,70 Q490.2,74 486.2,74 L220,74 Z" fill="#2a78d6"/>
  <text x="496.2" y="65" font-size="10.5" fill="#4a4943">+75%</text>
  <!-- Sonnet 5.5 +16.1% -->
  <path d="M220,90 L274.1,90 Q278.1,90 278.1,94 L278.1,112 Q278.1,116 274.1,116 L220,116 Z" fill="#eda100"/>
  <text x="284.1" y="107" font-size="10.5" fill="#4a4943">+16%</text>
  <g font-size="11" fill="#33322e" text-anchor="start">
    <text x="20" y="65">Opus 5.5 · algorithm-heavy</text>
    <text x="20" y="107">Sonnet 5.5 · algorithm-heavy</text>
  </g>
</svg>
