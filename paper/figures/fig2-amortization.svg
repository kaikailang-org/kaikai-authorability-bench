<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="520" height="360" fill="#ffffff"/>
  <text x="60" y="24" font-size="11" fill="#6b6a63">kaikai tokens per cell, as a multiple of the cheaper mainstream language</text>
  <!-- gridlines; y = 320 - multiple * 16.5 -->
  <g stroke="#e8e7e2" stroke-width="1">
    <line x1="110" y1="254" x2="420" y2="254"/>
    <line x1="110" y1="188" x2="420" y2="188"/>
    <line x1="110" y1="122" x2="420" y2="122"/>
    <line x1="110" y1="56" x2="420" y2="56"/>
  </g>
  <g font-size="10" fill="#6b6a63" text-anchor="end">
    <text x="104" y="324">0</text>
    <text x="104" y="258">4×</text>
    <text x="104" y="192">8×</text>
    <text x="104" y="126">12×</text>
    <text x="104" y="60">16×</text>
  </g>
  <line x1="110" y1="320" x2="420" y2="320" stroke="#4a4943" stroke-width="1"/>
  <g stroke-width="2" fill="none">
    <line x1="150" y1="251.4" x2="380" y2="246.9" stroke="#2a78d6"/>
    <line x1="150" y1="223.7" x2="380" y2="201.6" stroke="#eda100"/>
    <line x1="150" y1="66.3" x2="380" y2="95.8" stroke="#008300"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="251.4" r="4.5" fill="#2a78d6"/>
    <circle cx="380" cy="246.9" r="4.5" fill="#2a78d6"/>
    <circle cx="150" cy="223.7" r="4.5" fill="#eda100"/>
    <circle cx="380" cy="201.6" r="4.5" fill="#eda100"/>
    <circle cx="150" cy="66.3" r="4.5" fill="#008300"/>
    <circle cx="380" cy="95.8" r="4.5" fill="#008300"/>
  </g>
  <g font-size="10" fill="#4a4943" text-anchor="end">
    <text x="140" y="255.4">4.2×</text>
    <text x="140" y="227.7">5.8×</text>
    <text x="140" y="70.3">15.4×</text>
  </g>
  <g font-size="11" text-anchor="start">
    <text x="392" y="250.9" fill="#4a4943">4.4× · Opus 5.5</text>
    <text x="392" y="205.6" fill="#4a4943">7.2× · Sonnet 5.5</text>
    <text x="392" y="99.8" fill="#4a4943">13.6× · GLM-5.2</text>
  </g>
  <g font-size="12" fill="#33322e" text-anchor="middle">
    <text x="150" y="346">functions</text>
    <text x="380" y="346">modules</text>
  </g>
